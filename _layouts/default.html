<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip }}">
{% if site.noindex %}<meta name="robots" content="noindex">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
{% comment %} ?v= changes on every build, so browsers fetch fresh CSS and JS instead of a cached copy. {% endcomment %}
{% assign v = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ v }}">
</head>
<body>

{% if site.background_animation %}<canvas id="field" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>{% endif %}

{{ content }}

{% if site.background_animation %}<script src="{{ '/assets/js/field.js' | relative_url }}?v={{ v }}" defer></script>{% endif %}
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ v }}" defer></script>
</body>
</html>
