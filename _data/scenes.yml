# Chain-of-trust story. The first entry is the hero (camera only, no card).
# Each later entry becomes a scroll card and drives the 3D board.
#   n / t / p / cap  — rail label, card title, card text, capability badge
#   cam              — camera [x, y, z, lookAtX, lookAtY, lookAtZ]
#   routes / red     — PCB traces to light up (red = attack path)
#   hot              — components to highlight
#   labels           — [component id, text, dx, dy, dz]
#   sig/dbg/tee/stack/sand/agent/ota/shield/die — flags for special 3D effects

- cam: [9.2, 3.6, 9.4, 0.6, -0.2, 0.2]
  power: 0.3
  flow: 0.3

- n: Root of trust
  t: Root of trust in silicon
  p: The first instruction runs from boot ROM, burned into the chip. It reads the hash of your public key from one-time-programmable fuses. Nothing written later can change either.
  cap: Secure boot & firmware integrity
  cam: [-1.3, 2.5, 3.6, 0, 0.15, 0]
  hot: [soc]
  power: 1
  flow: 0.45
  die: 1
  labels:
    - [soc, Boot ROM, -0.7, 0, -0.6]
    - [soc, "OTP fuses · key hash", 0.7, 0, 0.65]

- n: Firmware verification
  sig: 1
  t: Firmware verification
  p: "Follow the SPI bus: ROM reads the bootloader from flash, hashes it and checks the signature against the key fused into the chip. A modified image never runs, and older vulnerable versions are refused."
  cap: "Signing infrastructure · HSM-backed, in your CI"
  cam: [-3.4, 3.4, 5.6, -0.3, 0.2, 0]
  routes: [r2]
  hot: [flash, soc]
  power: 1
  flow: 0.45
  labels:
    - [flash, Bootloader image, 0, 0, 0]
    - [sig, Signature check, 0, 0.1, -1.3]

- n: Debug lock
  dbg: 1
  t: Debug ports locked
  red: [r3]
  p: JTAG and SWD are the fastest way around every check above. In production they are fused off or gated behind authenticated debug, so the probe gets nowhere.
  cap: Secure boot & firmware integrity
  cam: [-7.6, 2.5, 6.4, -4.8, 0, 2.5]
  routes: [r3]
  hot: [jtag]
  power: 1
  flow: 0.35
  labels:
    - [jtag, JTAG / SWD, 0, 0.3, 0]
    - [lock, Locked, 0, 0, 0]

- n: Secure world
  tee: 1
  t: A secure world for secrets
  p: Keys and personal data live in a trusted execution environment, in memory the main operating system cannot read, even as root. Data is encrypted at rest and in transit.
  cap: Data protection on the device
  cam: [7.9, 3.6, 3.5, 5.15, 0.75, -2.5]
  routes: [r4]
  hot: [soc, dram1, dram2]
  power: 1
  flow: 0.45
  labels: []

- n: OS security
  t: A hardened Linux
  p: A minimal Yocto image. dm-verity checks every block of the root filesystem against a signed hash tree, LoadPin only loads kernel modules from it, and AppArmor confines each service.
  cap: Embedded Linux hardening
  cam: [5.6, 4.1, 8.2, -1.1, 1.75, 0.4]
  routes: [r5]
  hot: [emmc, soc]
  power: 1
  flow: 0.45
  stack: 1
  labels: []

- n: Sandboxing
  sand: 1
  t: Every service in its own box
  p: "Each service runs in its own sandbox: namespaces, a seccomp filter, cgroup limits and an AppArmor profile. When one process is compromised, the attacker is stuck inside that box, not loose on the machine."
  cap: "Embedded Linux hardening · namespaces, seccomp, cgroups"
  cam: [3.4, 3.3, 4.8, 0, 0.75, 0]
  hot: [soc]
  power: 1
  flow: 0.4
  labels:
    - [sb0, camera-svc, 0, 0.55, 0]
    - [sb2, telemetry, 0, 0.55, 0]
    - [sb4, Escape blocked, 0, 0.55, 0]

- n: AI model integrity
  t: Models signed like firmware
  p: AI weights are signed, verified before the accelerator loads them, and protected on the device. Model updates travel the same secure path as code.
  cap: AI model integrity
  cam: [-0.6, 2.7, 7.3, -1.4, 0, 2.9]
  routes: [r6]
  hot: [emmc, npu]
  power: 1
  flow: 0.45
  labels:
    - [emmc, "model · signed", 0, 0, 0]
    - [npu, Verify before load, 0, 0, 0]

- n: LLM & agent security
  agent: 1
  t: Agents that cannot be talked into it
  p: An on-device agent gets least-privilege tools, never root. Every tool call passes a policy gate, text from sensors, documents and the network is treated as untrusted data, and a prompt injection is stopped at the gate and logged.
  cap: "AI model integrity · agent guardrails"
  cam: [0.6, 3, 7.2, -3.6, 0.9, 3.1]
  hot: [npu]
  power: 1
  flow: 0.4
  labels:
    - [agent, "Agent · least privilege", 0, 0.45, 0]
    - [gate, Policy gate, 0, 0, 0]
    - [inj, Prompt injection blocked, 0, 0, 0]

- n: Secure updates
  ota: 1
  t: Updates that cannot brick
  p: Updates arrive signed, install to the inactive slot and switch only once they boot cleanly. If they do not, the machine rolls back. Every step leaves an audit trail.
  cap: Secure over-the-air updates
  cam: [8.6, 3.3, 6.6, 4.6, 0.8, 1.6]
  routes: [r7a, r7b]
  hot: [ant, modem, emmc]
  power: 1
  flow: 0.45
  labels:
    - [ant, Signed update, 0, 0.2, 0]

- n: Runtime protection
  t: Runtime protection
  red: [r8c, r8]
  p: An unauthorised command arrives on the CAN bus. On-device intrusion detection recognises it, blocks it and writes the event to a tamper-evident log, ready for the investigator or the approval authority.
  cap: Intrusion detection & logging
  cam: [3.8, 3.9, 8.6, 0.7, 0.8, 1.5]
  routes: [r8c, r8, r8b]
  hot: [can, se]
  power: 1
  flow: 0.4
  shield: 1
  labels:
    - [can, Unauthorised frame, 0, 0.3, 0.4]
    - [se, Tamper-evident log, 0, 0, 0]
