- stages: [Assess]
  title: Security assessment
  text: Threat analysis and a gap review against the regulations that apply to your product. You get a prioritised plan.
  when: Typically 2–4 weeks
- stages: [Design, Build]
  title: Implementation
  text: We build secure boot, signing, updates and hardening into your product, working in your codebase alongside your engineers.
  when: Scoped per project
- stages: [Operate]
  title: Continuous security
  text: Vulnerability monitoring against your actual build, signing operations, and support when something goes wrong.
  when: Billed monthly
